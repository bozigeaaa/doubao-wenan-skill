</main><script id="storyboard-data" type="application/json">{"title":"在沙特买打包箱，运费涨了，本地交付还差多少钱？","brand":"东方骆驼 · 数字人口播分镜","duration":"02:01.7","notes":["版本：依据本任务最新口语化定稿，标题不计入口播。19镜中文字幕连续拼接与定稿正文逐字一致；只拆分、翻译和安排画面。","估时：按每秒4个中文字符等价单位，每个语义停顿增加0.3秒；数字、英文和单位按中文读法折算。当前无原声，时间码为剪辑预估，数字人口播生成后再校准。","读法参考：2026读“二零二六”；40读“四十”；10,870读“一万零八百七十”；Xeneta估时按“泽内塔”四字计。","三版成片共用中文数字人口播原声和同一套画面，分别导出中文、英文、阿拉伯语字幕；不做三语同屏，不增加外语配音。外语版的信息卡文字同步换成对应语言。","数字人是主叙述者，可整篇生成口播，再按时间码插入画面；连续条件与结论镜头保留同一卡片。估时仅针对中文原声，不声称外语阅读速度已校准。","素材库尚未提供已审核素材卡与最近两条使用记录。全部素材卡标为“待关联素材”，无虚构编号。建议仅包含待补拍或中性示意图，不代表素材已经存在。","新闻图卡只摘要原公告和数据，不伪造新闻截图、港口封锁或客户报价；不将本地制造画面解释为当前库存、实际项目或承诺交期。","运价来源：Xeneta，2026-09-10；https://www.xeneta.com/news/xeneta-weekly-ocean-container-shipping-market-update-10.09.26","订舱来源：马士基第46次中东运营更新，2026-09-11；https://www.maersk.com/news/articles/2026/09/11/middle-east-operational-update-46","公司业务来源：项目知识库《东方骆驼公司简介.txt》。"],"rows":[["01","00:00.0–00:07.2","在沙特做临建，准备从国内买打包箱的，这笔运费得重新算了。","If you work in temporary construction in Saudi Arabia and plan to buy flat-pack units from China, it is time to recalculate the freight cost.","إذا كنت تعمل في المباني المؤقتة في السعودية وتخطط لشراء وحدات مسبقة الصنع مفككة من الصين، فقد حان وقت إعادة حساب تكلفة الشحن.","数字人中近景，直视镜头。前3秒轻推近，之后保持稳定。","留存钩子：这笔运费得重新算了；画面呈现：前0–3秒在数字人旁显示“在沙特做临建”，接“这笔运费得重新算了”。不增加价格对比或停工画面。数字人背景用中性箱房线稿。"],["02","00:07.2–00:12.8","2026 年 9 月 10 日，航运数据机构 Xeneta 公布，","On 10 September 2026, freight data provider Xeneta reported:","في ⁦10⁩ سبتمبر ⁦2026⁩، أعلنت مؤسسة بيانات الشحن ⁦Xeneta⁩:","数字人旁展开来源卡，日期和来源依次出现；语气接下一镜。","中性示意图：文字来源卡“Xeneta｜2026-09-10”。仅呈现已核实出处，不仿造机构网页或新闻截图。"],["03","00:12.8–00:22.7","中国到吉达，一个 40 英尺柜，当时订舱的市场平均运价已经到了 10,870 美元。","The average spot freight rate from China to Jeddah had reached USD 10,870 per 40-foot container.","بلغ متوسط سعر الشحن الفوري من الصين إلى جدة ⁦10,870⁩ دولارًا أمريكيًا للحاوية بطول ⁦40⁩ قدمًا.","数据卡占主画面，数字人保留小窗；先显航线，再显柜型和价格。","中性示意图：中国→吉达；40英尺柜；10,870美元/柜；标注“2026-09-10 平均即期运价”。不加1000美元起点，不画十倍涨幅。"],["04","00:22.7–00:29.3","马士基的公告也写明，达曼和朱拜勒的普通干货暂停订舱，","Maersk’s advisory also states that dry-cargo bookings for Dammam and Jubail are suspended,","كما يوضح إشعار ميرسك تعليق حجوزات البضائع الجافة للدمام والجبيل،","切换为马士基公告摘要卡，数字人继续讲述。","中性示意图：卡片标题“马士基公告｜2026-09-11”，在达曼、朱拜勒旁标注“普通干货暂停订舱”。不使用港口关闭、封锁或停工素材。"],["05","00:29.3–00:33.1","吉达和阿卜杜拉国王港还在接单。","while Jeddah and King Abdullah Port continue to accept bookings.","بينما تستمر جدة وميناء الملك عبدالله في قبول الحجوزات.","保持同一张公告卡，右侧补入仍接单的两港，完成上一镜条件范围。","中性示意图：吉达、阿卜杜拉国王港标注“普通干货继续接单”。上一镜的暂停项仍保留在同画面，避免截取后误读为全部港口暂停。"],["06","00:33.1–00:40.5","货走哪个港口，下船以后怎么拉到工地，都影响最后要花多少钱。","The port used and the road transport from the port to the site both affect the final cost.","الميناء المستخدم وطريقة نقل البضاعة منه إلى الموقع يؤثران في التكلفة النهائية.","用集装箱、港口、货车、工地的简洁图标接续动画，数字人画外讲述。","中性示意图：海运→港口→公路→工地，只表示运输环节，不绘制实际改道路线或里程。各环节费用留空，不编造报价。"],["07","00:40.5–00:47.2","同样一批打包箱，运费涨了，摊到每间房上的钱也跟着涨。","For the same batch of flat-pack units, higher freight costs mean a higher transport cost per unit.","بالنسبة إلى الدفعة نفسها من الوحدات المفككة، فإن ارتفاع أجور الشحن يزيد نصيب كل وحدة من تكلفة النقل.","切至打包箱线稿示意，多间房保持数量不变，运费箭头分摊到各房。","中性示意图：标注“同一批、数量不变”，显示“运费增加→每间分摊增加”。不标具体箱房数量或节省金额。"],["08","00:47.2–00:54.4","如果中途需要改路线、转运，或者暂时存放，还可能多出费用。","If rerouting, transfers or temporary storage are needed along the way, additional costs may arise.","إذا لزم تغيير المسار أو إعادة النقل أو التخزين المؤقت أثناء الرحلة، فقد تنشأ تكاليف إضافية.","返回数字人中景，旁边按口播浮现改路线、转运、暂存三个小图标。","中性示意图：始终保留“如果发生”的条件提示；每项用“可能产生费用”。不使用堆积货柜、拥堵或滞港实拍来暗示已发生。"],["09","00:54.4–00:58.8","买房时谈下来的价格，加上这些支出，","Add these expenses to the price negotiated for the units,","عند إضافة هذه المصروفات إلى السعر المتفق عليه للوحدات،","延续同一成本示意，将产品报价与实际运输支出放在一起；语义接下一镜。","中性示意图：“产品报价＋实际运输支出”。不将可能已包含在报价内的附加费重复相加；不放未经确认的订单、合同或金额。"],["10","00:58.8–01:04.7","送到工地以后还剩多少价格优势，就得重新算一遍。","and recalculate how much of the price advantage remains once they reach the site.","تحتاج إلى إعادة حساب مقدار الميزة السعرية المتبقية عند وصولها إلى الموقع.","示意落到“送到工地”，数字人回到主画面，停顿后转换到本地方案。","中性示意图：将终点文字“送到工地的总价”加框。保留判断空间，不出现“进口更贵”或“本地必省”结论。"],["11","01:04.7–01:09.8","可以拿沙特本地生产的打包箱，一起比比价。","You can compare that with flat-pack units manufactured locally in Saudi Arabia.","يمكنك مقارنة ذلك بسعر الوحدات المفككة المصنعة محليًا في السعودية.","数字人半身中景，两侧出现“国内采购”“沙特本地生产”两个方案标签。","中性示意图：两种方案等大、同色系呈现，不给其中一方加优胜标识。箱房仅用同款线稿保证比较对象一致。"],["12","01:09.8–01:14.2","东方骆驼就在沙特生产、供应打包箱。","Eastern Camel manufactures and supplies flat-pack units in Saudi Arabia.","تقوم ⁦Eastern Camel⁩ بتصنيع وتوريد الوحدات المفككة في السعودية.","数字人继续讲述；有合格实拍后，可切入工厂加工与箱房产品画面。","待补拍：东方骆驼沙特工厂打包箱加工及产品外观；实际取得并审核后再使用。未取得时保留数字人，显示“东方骆驼｜沙特生产、供应打包箱”。不使用他厂素材冒充。"],["13","01:14.2–01:20.1","如果做这批箱房的材料已经备齐，在当地完成生产，","If the materials for this batch are ready and production is completed locally,","إذا كانت مواد هذه الدفعة قد جُهزت بالفعل واكتمل التصنيع محليًا،","数字人侧旁展开条件卡，保持“材料已备齐”与“当地生产”同时可见。","中性示意图：醒目标注“条件：材料已备齐、当地生产”。不使用成堆材料或仓库画面证明当前库存，也不写“现货”。条件卡延续至下一镜。"],["14","01:20.1–01:29.2","就省去了这批箱房成品从国内跨海运过来的环节，也少了一段等国际船期的过程。","there is no need to ship that batch of finished units from China by sea, removing that wait for an international sailing.","فلن تكون هناك حاجة إلى شحن هذه الدفعة من الوحدات الجاهزة بحرًا من الصين، ولا إلى انتظار الرحلة البحرية الدولية الخاصة بها.","沿用上一镜条件卡，用当地工厂→项目工地的抽象示意说明成品路径。","中性示意图：明确标注“这批箱房成品”，对比仅针对成品跨海运输环节；不暗示原材料全部本地化，不标减少天数或承诺交期。"],["15","01:29.2–01:37.4","比较的时候，用一样的配置、一样的数量，都算到送进同一个工地为止。","Compare the same specifications and quantity, with delivery to the same site included.","قارن المواصفات نفسها والكمية نفسها، مع احتساب التوصيل إلى الموقع نفسه.","回到数字人，画面下方出现同配置、同数量、同一工地三个比较条件。","中性示意图：并排展示同款箱房线稿和同一个工地终点；条件文字服务于比较，不展示虚构规格、面积或配置清单。"],["16","01:37.4–01:44.5","国内采购加上实际运输费用，再对照本地生产送到工地的报价，","Compare the purchase price in China plus actual transport costs with the locally manufactured, delivered-to-site quote.","قارن سعر الشراء من الصين مضافًا إليه تكاليف النقل الفعلية، بعرض التصنيع المحلي شاملًا التوصيل إلى الموقع.","相同条件标签保留，下面展开两条总价表达；数字人画外讲述，接下一镜。","中性示意图：“国内采购价＋实际运输费”与“本地生产到场报价”并排。金额用空白线，不虚构客户报价；只计实际需要且未重复包含的费用。"],["17","01:44.5–01:47.6","两边差多少钱，就清楚了。","That shows the price difference between the two options.","وبذلك يتضح فرق السعر بين الخيارين.","保持对比画面，中间出现“比较差额”，停顿后回数字人。","中性示意图：差额用问号或空白，不给出正负方向，不出现折扣、节省比例或胜负图标。"],["18","01:47.6–01:53.8","海运价格变了，以前算过的价格差，也值得再看一眼。","With ocean freight prices changing, it is worth revisiting the price difference you calculated before.","مع تغيّر أسعار الشحن البحري، يجدر مراجعة فرق السعر الذي حسبته سابقًا.","数字人中近景，收拢前文判断；背景恢复开场中性箱房线稿。","中性示意图：仅保留“按当前运费重新比较”短句，不再次列出整个核对清单，不添加市场预测。"],["19","01:53.8–02:01.7","在沙特有打包箱需求，可以联系东方骆驼，问问本地生产交付的价格。","If you need flat-pack units in Saudi Arabia, contact Eastern Camel for a local production and delivery quote.","إذا كنت تحتاج إلى وحدات مفككة في السعودية، يمكنك التواصل مع ⁦Eastern Camel⁩ لمعرفة سعر التصنيع والتسليم المحلي.","数字人直视镜头自然收尾，末尾短暂停留在品牌文字和同一联系动作。","中性示意图：文字“东方骆驼｜咨询本地生产交付价格”。如需电话、二维码或Logo，待提供并审核真实素材；不编号码，不承诺免费方案或固定交期。"]],"materials":{"10":{"status":"待关联素材"},"11":{"status":"待关联素材"},"12":{"status":"待关联素材"},"13":{"status":"待关联素材"},"14":{"status":"待关联素材"},"15":{"status":"待关联素材"},"16":{"status":"待关联素材"},"17":{"status":"待关联素材"},"18":{"status":"待关联素材"},"19":{"status":"待关联素材"},"01":{"status":"待关联素材"},"02":{"status":"待关联素材"},"03":{"status":"待关联素材"},"04":{"status":"待关联素材"},"05":{"status":"待关联素材"},"06":{"status":"待关联素材"},"07":{"status":"待关联素材"},"08":{"status":"待关联素材"},"09":{"status":"待关联素材"}}}</script><script>
const doc=JSON.parse(document.getElementById('storyboard-data').textContent);const data=doc.rows;const clean=data.map(r=>r.slice());const headers=['镜号','时间码','中文字幕','英文字幕','阿拉伯语字幕','分镜','画面／素材建议'];const classes=['index','time','subtitle zh','subtitle en','subtitle ar','scene','visual'];
document.title=doc.title+' · 分镜脚本';document.getElementById('title').textContent=doc.title;document.getElementById('brand').textContent=doc.brand||'分镜脚本';document.getElementById('shot-count').textContent=data.length;document.getElementById('duration').textContent=doc.duration||data.at(-1)[1].split(/[–—]/).at(-1);document.getElementById('count').textContent=data.length+' 镜 · 字幕、翻译与时间码保持原稿';for(const t of doc.notes||[]){const p=document.createElement('p');p.textContent=t;document.getElementById('notes').append(p)}if(!doc.notes?.length)document.querySelector('details').hidden=true;
function materialPick(shot){const pick=doc.materials?.[shot];const codes=pick?.codes||[];const box=document.createElement('div');box.className='material-pick'+(codes.length?'':' pending');const heading=document.createElement('div');heading.className='material-heading';heading.textContent='推荐素材';box.append(heading);if(codes.length){if(pick.example){const flag=document.createElement('span');flag.className='material-example';flag.textContent='示例编号';heading.append(flag)}const line=document.createElement('div');line.className='material-codes';codes.forEach(code=>{const tag=document.createElement('span');tag.className='material-code';tag.textContent=code;line.append(tag)});box.append(line)}else{const empty=document.createElement('div');empty.className='material-pending';empty.textContent=pick?.status||'待关联素材';box.append(empty)}if(pick?.usage){const usage=document.createElement('div');usage.className='material-pending';usage.textContent=pick.usage;box.append(usage)}return box}
function render(view){const ids=view==='all'?[0,1,2,3,4,5,6]:[0,1,{zh:2,en:3,ar:4}[view],5,6];document.body.classList.toggle('all',view==='all');const widths=view==='all'?['64px','186px','300px','340px','350px','310px','474px']:['64px','186px','29%','24%',null];document.getElementById('columns').replaceChildren();document.getElementById('head').replaceChildren();document.getElementById('rows').replaceChildren();ids.forEach((id,i)=>{const col=document.createElement('col');if(widths[i])col.style.width=widths[i];document.getElementById('columns').append(col);const th=document.createElement('th');th.scope='col';th.className=id<2?classes[id]:'';th.textContent=headers[id];document.getElementById('head').append(th)});clean.forEach(r=>{const tr=document.createElement('tr');ids.forEach(id=>{const td=document.createElement('td');td.className=classes[id];if(id===4){td.lang='ar';td.dir='rtl'}if(id===3)td.lang='en';if(id===0){const n=document.createElement('span');n.textContent=r[id];td.append(n)}else if(id===6&&r[id].includes('；画面呈现：')){const parts=r[id].split('；画面呈现：');const first=document.createElement('strong');first.className='stack-line';first.textContent=parts[0];const second=document.createElement('span');second.className='stack-line';second.textContent='画面呈现：'+parts[1];td.append(first,second)}else td.textContent=r[id];if(id===6)td.prepend(materialPick(r[0]));tr.append(td)});document.getElementById('rows').append(tr)});document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));document.getElementById('view-hint').textContent=({zh:'中文口播与剪辑建议并排审阅',en:'英文字幕与剪辑建议并排审阅',ar:'阿拉伯语字幕独立右对齐',all:'完整七列 · 横向滚动查看 · 镜号与时间码固定'})[view];document.querySelector('.table-wrap').scrollLeft=0}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.view)));render('zh');
</script></body></html>
