</main><script id="storyboard-data" type="application/json">[["01","00:00.0–00:07.4","你选轻钢宿舍，同样是两间房，厨卫怎么配，员工的住法就不一样。","When choosing light-steel dormitories, two bedrooms can support different living arrangements depending on the kitchen and bathrooms.","‏عندما تختار مساكن من الفولاذ الخفيف للموظفين، قد تختلف طريقة السكن رغم وجود غرفتي نوم في الحالتين، بحسب توزيع المطبخ والحمامات.","数字人中景直视镜头，旁侧出现功能图标。全表按每秒4个中文字符等价单位、每个语义停顿增加0.3秒估时，待原声校准。","留存钩子：同样两间房，厨卫怎么配？；画面呈现：前0–3秒固定两个卧室图标，再显现厨房、卫生间图标，突出功能组合差异。采用中性示意图。全片共用中文原声和画面，中英阿字幕分别导出，不做三语同屏；阿语版按RTL排版。"],["02","00:07.4–00:17.5","沙特MAO新公布的工业园规划里，包含员工居住社区，具体采用什么建筑结构还没披露。","MAO’s newly announced industrial complex plan in Saudi Arabia includes an employee residential community. The building structure has not yet been disclosed.","‏تتضمن خطة المجمع الصناعي التي أعلنتها ⁦MAO⁩ مؤخراً في السعودية مجتمعاً سكنياً للموظفين، ولم يُكشف بعد عن النظام الإنشائي للمباني.","数字人保留在画面一侧，另一侧展示简洁新闻文字卡。","中性文字示意：“MAO工业园规划”“包含员工居住社区”“建筑结构未披露”。依据已核验公告制作，不使用轻钢房画面冒充MAO项目效果图或现场。"],["03","00:17.5–00:22.3","借这个住宿场景，咱们聊聊轻钢户型怎么选。","Let’s use this housing scenario to discuss how to choose a light-steel layout.","‏لنستخدم هذا السيناريو السكني للحديث عن كيفية اختيار مخطط المسكن المصنوع من الفولاذ الخفيف.","镜头回到数字人，新闻卡淡出，转入户型讨论。","中性示意图：空白房屋轮廓逐渐出现，标注“住宿方案讨论”。不延续MAO项目标识到产品示意图上。"],["04","00:22.3–00:30.8","先别急着挑效果图。你先想想，吃饭、洗澡、上厕所，这些功能准备放在哪儿。","Before picking a rendering, think about where residents will eat, shower and use the toilet.","‏قبل أن تتعجل في اختيار صورة تصورية، فكّر أولاً في الأماكن المخصصة للأكل والاستحمام واستخدام المرحاض.","数字人讲述，功能图标依次浮现；不单独切成三个碎镜头。","中性示意图：餐具、淋浴、卫生间三个图标，分别向“住宿单元内”和“公共配套区”两个区域移动，表现待选择的功能位置。"],["05","00:30.8–00:37.4","假设社区已经安排了食堂和公共卫浴，宿舍主要用来休息，","Suppose the community already includes a dining hall and shared bathrooms, and the dormitories are mainly for rest.","‏لنفترض أن المجتمع السكني يضم بالفعل قاعة طعام ومرافق استحمام ودورات مياه مشتركة، وأن المساكن مخصصة أساساً للراحة،","数字人缩小至侧边，功能分区图占主画面；与下一镜保持同一场景。","中性示意图：外部公共区显示食堂和卫浴，住宿区突出卧室。显著标注“假设场景”，不得画成MAO已确定的社区布局。"],["06","00:37.4–00:47.3","那就可以从两房布局入手。如果要求卫生间放进住宿单元，就要进一步比较带卫浴的户型。","You can start with a two-bedroom layout. If bathrooms are required within the accommodation unit, compare layouts that include them.","‏فيمكن البدء بمخطط يضم غرفتي نوم. وإذا كان المطلوب وضع الحمامات داخل الوحدة السكنية، فينبغي مقارنة المخططات التي تشملها.","延续上一镜，随条件变化切换两种功能组合。","中性示意图：先突出“两房”，再为“单元内需要卫生间”的分支增加卫浴图标。只示意功能，不标面积、床位数或确定的门窗位置。"],["07","00:47.3–00:55.7","拿东方骆驼的薄壁轻钢房资料来说，有两房、两房两卫，也有两房一厨一卫。","Eastern Camel’s thin-walled light-steel housing materials list two-bedroom layouts, two bedrooms with two bathrooms, and two bedrooms with one kitchen and one bathroom.","‏تتضمن مواد إيسترن كامِل ⁦(Eastern Camel)⁩ التعريفية بمنازل الفولاذ الخفيف رقيق الجدران مخططات بغرفتي نوم، وغرفتي نوم وحمامين، وغرفتي نوم ومطبخ واحد وحمام واحد.","数字人讲述，旁侧展开三张户型名称卡。","中性示意图：按原始产品资料列出“两房”“两房两卫”“两房一厨一卫”，用图标表示数量。品牌名称自然展示一次；不虚构产品图册截图或实际平面图。"],["08","00:55.7–01:03.3","它们的区别，落到使用上，就是哪些生活功能放在房子里面、由谁共用。","In practical use, the difference is which daily functions are inside the unit and who shares them.","‏عملياً، يكمن الفرق في الوظائف اليومية الموجودة داخل الوحدة السكنية، ومن يتشارك استخدامها.","保留三张功能卡，将视觉重点从名称转向使用关系。","中性示意图：以房屋边框表示单元范围，用人物图标与功能图标之间的连线表示共用关系。标注“功能关系示意”，不暗示某款产品的实际入口布局。"],["09","01:03.3–01:09.4","比如，员工有自己做饭的需求，就可以看两房一厨一卫。","For example, if employees need to cook for themselves, consider two bedrooms with one kitchen and one bathroom.","‏مثلاً، إذا كان الموظفون يحتاجون إلى إعداد طعامهم بأنفسهم، فيمكن النظر في مخطط يضم غرفتي نوم ومطبخاً واحداً وحماماً واحداً.","数字人指向“两房一厨一卫”卡，厨房图标点亮。","中性示意图：显示“有自行做饭需求”条件，再突出厨房。避免补画燃气设备、排烟系统等未在本稿核实的具体配置。"],["10","01:09.4–01:18.5","这里的厨房是为了满足做饭需求，不能只因为户型看着更齐全，就默认每套都要配。","The kitchen serves a cooking need. Don’t assume every unit needs one simply because the layout looks more complete.","‏المطبخ هنا يلبي حاجة إلى الطهي. فلا تفترض أن كل وحدة تحتاج إليه لمجرد أن المخطط يبدو أكثر اكتمالاً.","切回数字人较近景，保留厨房图标作为解释对象。","中性示意图：厨房图标与“实际做饭需求”相连；不使用“高配”“低配”排名，也不加入成本节省数字或项目采购结论。"],["11","01:18.5–01:25.4","再看两房两卫。你如果希望两间卧室分别使用各自的卫生间，","Now consider two bedrooms with two bathrooms. If you want each bedroom to use its own bathroom,","‏لننظر الآن إلى غرفتي نوم وحمامين. إذا كنت تريد أن تستخدم كل غرفة نوم حماماً خاصاً بها،","数字人引入新的使用条件，画面切至“两房两卫”功能卡；与下一镜连贯呈现。","中性示意图：两个卧室和两个卫生间图标分开排布，标注“目标：分别使用”。暂不画连通门，避免提前把目标当作产品已具备的布局。"],["12","01:25.4–01:31.8","光看这个名字还不够。它说明的是房间和卫生间的数量，","The name alone is not enough. It tells you the number of bedrooms and bathrooms.","‏فاسم المخطط وحده لا يكفي؛ فهو يوضح عدد غرف النوم والحمامات،","镜头轻推功能卡，强调数量信息。","中性示意图：“两房两卫”中的两个“两”分别对应卧室、卫生间图标。屏幕短句“名称说明数量”，不添加“独立套卫”等未经图纸证明的标识。"],["13","01:31.8–01:37.9","入口怎么开、使用时是否经过公共空间，还得看平面图。","Check the floor plan to see where the entrances are and whether access passes through shared space.","‏أما مواقع المداخل وما إذا كان الوصول إليها يمر بمساحة مشتركة، فيجب التحقق منها في المخطط الأفقي.","从数量卡过渡到入口与通行路线示意，数字人持续讲述。","中性示意图：分别演示“从卧室直接进入”和“经公共空间进入”的路线。明确标注“入口关系示意，非产品定稿平面图”，不提供尺寸或施工节点。"],["14","01:37.9–01:46.1","所以啊，选户型时，把员工从卧室去厨房、去卫生间的路线在图上走一遍。","So, when choosing a layout, trace the routes from the bedroom to the kitchen and bathroom on the plan.","‏لذلك، عند اختيار المخطط، تتبّع عليه مسار الموظف من غرفة النوم إلى المطبخ وإلى الحمام.","延续示意图，用移动光点依次走过两条路线。","中性示意图：卧室为起点，分别用两种颜色显示去厨房、去卫生间的路线；保持“功能示意”标识，不制作真实人员入住镜头。"],["15","01:46.1–01:52.5","共用到哪一步、独立到哪一步，才是你要比较的实际区别。","The practical difference to compare is which parts are shared and which are private.","‏الفرق العملي الذي ينبغي مقارنته هو ما يُستخدم بشكل مشترك وما يُستخدم بشكل مستقل.","数字人回到主画面，旁侧保留路线图，收束判断。","中性示意图：用色块区分“共用区域”和“独立使用区域”，对应上一镜路线，不增加新的户型或产品卖点。"],["16","01:52.5–01:59.1","你们的员工宿舍更需要独立卫浴，还是带厨房？评论区聊聊。","Do your employee dormitories need private bathrooms or kitchens more? Let us know in the comments.","‏هل تحتاج مساكن موظفيكم أكثر إلى حمامات خاصة أم إلى مطابخ؟ شاركونا في التعليقات.","数字人中近景直视镜头，问句后自然停顿，完成评论邀请。","中性文字示意：“独立卫浴／带厨房”，作为需求讨论选项，不暗示两种配置不能并存。画面停留至原声结束，不叠加咨询、领资料或联系方式。"]]</script><script>
const data=JSON.parse(document.getElementById('storyboard-data').textContent);const headers=['镜号','时间码','中文字幕','英文字幕','阿拉伯语字幕','分镜','画面／素材建议'];const classes=['index','time','subtitle zh','subtitle en','subtitle ar','scene','visual'];const clean=data.map(r=>r.slice());const noteStart=clean[0][5].indexOf('全表');const note1=clean[0][5].slice(noteStart);clean[0][5]=clean[0][5].slice(0,noteStart);const note2Start=clean[0][6].indexOf('全片共用');const note2=clean[0][6].slice(note2Start);clean[0][6]=clean[0][6].slice(0,note2Start);for(const t of [note1,note2]){const p=document.createElement('p');p.textContent=t;document.getElementById('notes').append(p)}

function materialPick(shot){const examples={'01':['SC-0027','SC-0084']};const codes=examples[shot];const box=document.createElement('div');box.className='material-pick'+(codes?'':' pending');const heading=document.createElement('div');heading.className='material-heading';heading.textContent='推荐素材';box.append(heading);if(codes){const flag=document.createElement('span');flag.className='material-example';flag.textContent='示例编号';heading.append(flag);const line=document.createElement('div');line.className='material-codes';codes.forEach(code=>{const tag=document.createElement('span');tag.className='material-code';tag.textContent=code;line.append(tag)});box.append(line)}else{const empty=document.createElement('div');empty.className='material-pending';empty.textContent='待关联素材';box.append(empty)}return box}
function render(view){const ids=view==='all'?[0,1,2,3,4,5,6]:[0,1,{zh:2,en:3,ar:4}[view],5,6];document.body.classList.toggle('all',view==='all');const widths=view==='all'?['64px','186px','300px','340px','350px','310px','474px']:['64px','186px','29%','24%',null];document.getElementById('columns').replaceChildren();document.getElementById('head').replaceChildren();document.getElementById('rows').replaceChildren();ids.forEach((id,i)=>{const col=document.createElement('col');if(widths[i])col.style.width=widths[i];document.getElementById('columns').append(col);const th=document.createElement('th');th.scope='col';th.className=id<2?classes[id]:'';th.textContent=headers[id];document.getElementById('head').append(th)});clean.forEach(r=>{const tr=document.createElement('tr');ids.forEach(id=>{const td=document.createElement('td');td.className=classes[id];if(id===4){td.lang='ar';td.dir='rtl'}if(id===3)td.lang='en';if(id===0){const n=document.createElement('span');n.textContent=r[id];td.append(n)}else if(id===6&&r[id].includes('；画面呈现：')){const parts=r[id].split('；画面呈现：');const first=document.createElement('strong');first.className='stack-line';first.textContent=parts[0];const second=document.createElement('span');second.className='stack-line';second.textContent='画面呈现：'+parts[1];td.append(first,second)}else td.textContent=r[id];if(id===6)td.prepend(materialPick(r[0]));tr.append(td)});document.getElementById('rows').append(tr)});document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));document.getElementById('view-hint').textContent=({zh:'中文口播与剪辑建议并排审阅',en:'英文字幕与剪辑建议并排审阅',ar:'阿拉伯语字幕独立右对齐',all:'完整七列 · 横向滚动查看 · 镜号与时间码固定'})[view];document.querySelector('.table-wrap').scrollLeft=0}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.view)));render('zh');
</script></body></html>
